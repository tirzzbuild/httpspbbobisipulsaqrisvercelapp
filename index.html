<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63f6">
<title>Aruna PPOB</title>
<style>
:root{--blue:#0b63f6;--ink:#14213d;--muted:#68758b;--bg:#f4f7fc;--line:#e5ebf4;--green:#16a36a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:520px;min-height:100dvh;margin:auto;background:var(--bg);padding-bottom:30px}
.hero{background:linear-gradient(140deg,#0757df,#1689ff);color:#fff;padding:24px 20px 32px;border-radius:0 0 28px 28px}
.top{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.logo{width:38px;height:38px;display:grid;place-items:center;background:#ffffff26;border:1px solid #ffffff45;border-radius:13px;font-size:22px}
.hero p{color:#e4efff;margin:8px 0 0;font-size:13px}.content{padding:0 15px;margin-top:-15px}
.panel{background:#fff;border:1px solid #edf1f7;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 26px #173b6b08}
.balance{display:flex;justify-content:space-between;align-items:center;gap:10px}.eyebrow{font-size:12px;color:var(--muted)}.balance strong{display:block;font-size:24px;letter-spacing:-.5px;margin-top:3px}.pill{font-size:11px;color:#8a5b00;background:#fff4d6;padding:6px 9px;border-radius:99px;font-weight:700}
h2{font-size:16px;margin:0 0 14px}h3{font-size:14px;margin:0 0 10px}
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.service{border:1px solid var(--line);background:#f8faff;border-radius:15px;padding:12px 3px;text-align:center;color:var(--ink)}.service .emoji{font-size:23px;display:block;margin-bottom:5px}.service span:last-child{font-size:11px;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}.tab{padding:10px 5px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:12px;font-weight:700}.tab.active{background:#eaf2ff;border-color:#b8d1ff;color:var(--blue)}
label{display:block;font-size:12px;font-weight:700;margin:13px 0 7px}input,select{width:100%;padding:13px;border:1px solid #dce4f0;border-radius:12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:#6ea5ff;box-shadow:0 0 0 3px #0b63f615}
.amounts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.amount{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;color:var(--ink)}.amount small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.amount.active{border-color:var(--blue);background:#eff5ff;color:var(--blue)}
.primary{width:100%;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:800;padding:14px;margin-top:17px;box-shadow:0 7px 16px #0b63f626}.primary:disabled{opacity:.55;cursor:not-allowed}
.notice{font-size:12px;color:#74521b;background:#fff8e8;border:1px solid #ffedc2;padding:11px 12px;border-radius:12px;margin-top:12px}.status{font-size:13px;color:var(--muted);padding:12px;background:#f7f9fd;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.history-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border-bottom:0}.history-item b{font-size:13px}.history-item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:8px 22px 22px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="top"><div class="logo">⚡</div><div>ARUNA <span style="font-weight:500">PPOB</span></div></div>
